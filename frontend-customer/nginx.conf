server {
  listen 80;
  root /usr/share/nginx/html;
  # Bare path (no trailing slash) → canonical subpath. Keeps query strings.
  location = /customer { return 301 /customer/$is_args$args; }
  location /customer/ {
    alias /usr/share/nginx/html/;
    try_files $uri $uri/ /customer/index.html;
  }
  location /customer/assets/ {
    alias /usr/share/nginx/html/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /customer/sw.js { alias /usr/share/nginx/html/sw.js; add_header Cache-Control "no-cache"; }
  location = /customer/manifest.webmanifest { alias /usr/share/nginx/html/manifest.webmanifest; add_header Cache-Control "no-cache"; }
}
