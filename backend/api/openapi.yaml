                "404": { $ref: "#/components/responses/Problem" }
components:
    securitySchemes: { bearer: { type: http, scheme: bearer } }
    responses:
        Problem:
            {
                description: problem,
                content:
                    {
                        application/problem+json:
                            {
                                schema:
                                    { $ref: "#/components/schemas/Problem" },
                            },
                    },
            }
    schemas:
        Problem:
            {
                type: object,
                properties:
                    {
                        type: { type: string },
                        title: { type: string },
                        status: { type: integer },
                        detail: { type: string },
                    },
            }
        Money:
            {
                type: object,
                required: [amount_minor, currency],
                properties:
                    {
                        amount_minor:
                            {
                                type: integer,
                                minimum: 0,
                                description: "Integer minor units (ISO 4217), never floats",
                            },
                        currency: { type: string, minLength: 3, maxLength: 3 },
                    },
            }
        GeoPoint:
            {
                type: object,
                required: [lat, lng],
                properties:
                    {
                        lat: { type: number },
                        lng: { type: number },
                        note: { type: string },
                    },
            }
        OrderStatus:
            {
                type: string,
                enum:
                    [
                        awaiting_payment,
                        placed,
                        accepted,
                        ready,
                        picked_up,
                        delivered,
                        completed,
                        rejected,
                        cancelled,
                    ],
            }
        OrderItemInput:
            {
                type: object,
                required: [menu_item_id, qty],
                properties:
                    {
                        menu_item_id: { type: string, format: uuid },
                        qty: { type: integer, minimum: 1, maximum: 20 },
                    },
            }
        CreateOrder:
            type: object
            required: [merchant_id, items]
            properties:
                merchant_id: { type: string, format: uuid }
                items:
                    {
                        type: array,
                        minItems: 1,
                        maxItems: 20,
                        items: { $ref: "#/components/schemas/OrderItemInput" },
                    }
                address_id: { type: string, format: uuid }
                lat: { type: number }
                lng: { type: number }
                note: { type: string }
                tip_minor: { type: integer, minimum: 0, default: 0 }
                payment_method:
                    {
                        type: string,
                        enum: [wallet, card],
                        default: wallet,
                        description: "card orders wait in awaiting_payment for the Paddle sandbox webhook",
                    }
        RejectOrder: { type: object, properties: { reason: { type: string } } }
        Order:
            type: object
            properties:
                id: { type: string, format: uuid }
                code: { type: string }
                status: { $ref: "#/components/schemas/OrderStatus" }
                merchant_id: { type: string, format: uuid }
                currency: { type: string }
                subtotal: { $ref: "#/components/schemas/Money" }
                delivery_fee: { $ref: "#/components/schemas/Money" }
                service_fee: { $ref: "#/components/schemas/Money" }
                tip: { $ref: "#/components/schemas/Money" }
                total: { $ref: "#/components/schemas/Money" }
                commission: { $ref: "#/components/schemas/Money" }
                size_class: { type: string, enum: [S, M, L] }
                spill_risk: { type: string, enum: [low, medium, high] }
                payment_method: { type: string, enum: [wallet, card] }
                payment_status:
                    { type: string, enum: [unpaid, held, paid, refunded] }
                dropoff: { $ref: "#/components/schemas/GeoPoint" }
                delivery_pin:
                    {
                        type: string,
                        description: "Customer handover PIN (customer view only)",
                    }
                pickup_code:
                    {
                        type: string,
                        description: "Merchant handover code (merchant view only)",
                    }
                ready_at_est: { type: string, format: date-time }
                window_start: { type: string, format: date-time }
                window_end: { type: string, format: date-time }
                created_at: { type: string, format: date-time }
                delivery:
                    {
                        type: object,
                        description: "Live delivery: status, eta_s, route, courier profile (order detail only)",
                    }
        OrderEnvelope:
            {
                type: object,
                properties:
                    {
                        order: { $ref: "#/components/schemas/Order" },
                        refunded: { type: boolean },
                        payment:
                            {
                                $ref: "#/components/schemas/Payment",
                                description: "Pending Paddle payment (card orders only)",
                            },
                    },
            }
        OrderList:
            {
                type: object,
                properties:
                    {
                        orders:
                            {
                                type: array,
                                items: { $ref: "#/components/schemas/Order" },
                            },
                    },
            }
        OrderDetail:
            {
                type: object,
                properties: { order: { $ref: "#/components/schemas/Order" } },
            }
        CategoryInput:
            {
                type: object,
                properties:
                    {
                        name:
                            {
                                type: object,
                                additionalProperties: { type: string },
                            },
                        sort: { type: integer },
                    },
            }
        CategoryList:
            {
                type: object,
                properties:
                    { categories: { type: array, items: { type: object } } },
            }
        MenuItemInput:
            type: object
            properties:
                category_id: { type: string, format: uuid }
                name: { type: object, additionalProperties: { type: string } }
                description:
                    { type: object, additionalProperties: { type: string } }
                price_minor: { type: integer, minimum: 0 }
                size_class: { type: string, enum: [S, M, L] }
                spill_risk: { type: string, enum: [low, medium, high] }
                travels_well: { type: boolean }
                photo_url: { type: string }
                available: { type: boolean }
        MenuItemList:
            {
                type: object,
                properties: { items: { type: array, items: { type: object } } },
            }
        CourierMode: { type: string, enum: [runner, biker] }
        CourierProfileInput:
            type: object
            properties:
                mode: { $ref: "#/components/schemas/CourierMode" }
                legal_name: { type: string }
                birth_date:
                    {
                        type: string,
                        format: date,
                        description: "YYYY-MM-DD; 18+ only",
                    }
                nationality: { type: string }
                address: { type: object, additionalProperties: true }
                emergency_contact: { type: object, additionalProperties: true }
                phone: { type: string, description: "E.164" }
                id_doc_type: { type: string }
                id_number:
                    {
                        type: string,
                        description: "AES-GCM sealed server-side, never returned",
                    }
                id_front_file_id: { type: string, format: uuid }
                id_back_file_id: { type: string, format: uuid }
                selfie_file_id: { type: string, format: uuid }
                bike: { type: object, additionalProperties: true }
                bag_liters: { type: integer, minimum: 0 }
                consents: { type: object, additionalProperties: true }
        CourierProfile:
            allOf:
                - $ref: "#/components/schemas/CourierProfileInput"
                - type: object
                  properties:
                      status: { type: string }
                      id_number_saved: { type: boolean }
                      approved_at: { type: string, format: date-time }
        StartSession:
            type: object
            properties:
                kind:
                    { type: string, enum: [qualification, work], default: work }
                mode: { $ref: "#/components/schemas/CourierMode" }
                goal_distance_m:
                    { type: number, description: "Workout goal, meters" }
                goal_duration_s:
                    { type: integer, description: "Workout goal, seconds" }
                planned_track:
                    {
                        type: object,
                        description: "GeoJSON LineString, optional saved/AI track",
                    }
        Session:
            type: object
            properties:
                id: { type: string, format: uuid }
                kind: { type: string, enum: [qualification, work] }
                mode: { $ref: "#/components/schemas/CourierMode" }
                status: { type: string, enum: [active, stale, ended] }
                started_at: { type: string, format: date-time }
                ended_at: { type: string, format: date-time }
                goal_distance_m: { type: number }
                goal_duration_s: { type: integer }
                distance_m: { type: number }
                moving_s: { type: integer }
                active_s: { type: integer }
                elapsed_s: { type: integer }
                pace_s_per_km: { type: number }
                speed_kmh: { type: number }
                steps: { type: integer }
                stale: { type: boolean }
                checkpoint_due: { type: boolean }
                flags: { type: array, items: { type: string } }
        SessionEnvelope:
            type: object
            properties:
                session: { $ref: "#/components/schemas/Session" }
                qualification:
                    type: object
                    properties:
                        passed: { type: boolean }
                        distance_m: { type: number }
                        moving_s: { type: integer }
                        elapsed_s: { type: integer }
                        max_gap_s: { type: integer }
                        flags: { type: array, items: { type: string } }
                        fail_reasons: { type: array, items: { type: string } }
                        message: { type: string }
                        target_distance_m: { type: number }
                        moving_limit_s: { type: integer }
                        retry_after_s: { type: integer }
        SessionList:
            {
                type: object,
                properties:
                    {
                        sessions:
                            {
                                type: array,
                                items: { $ref: "#/components/schemas/Session" },
                            },
                    },
            }
        LocPoint:
            type: object
            required: [ts, lat, lng]
            properties:
                ts:
                    {
                        type: string,
                        format: date-time,
                        description: "Phone timestamp, ISO-8601 UTC, forward-only",
                    }
                lat: { type: number }
                lng: { type: number }
                acc:
                    {
                        type: number,
                        description: "GPS accuracy, meters; over 30 m is skipped",
                    }
                heading: { type: number }
                altitude_m: { type: number }
                steps_delta: { type: integer }
        LocBatch:
            type: object
            required: [session_id, points]
            properties:
                session_id: { type: string, format: uuid }
                points:
                    {
                        type: array,
                        minItems: 1,
                        maxItems: 500,
                        items: { $ref: "#/components/schemas/LocPoint" },
                    }
        LocAck:
            type: object
            properties:
                accepted: { type: integer }
                skipped: { type: object }
                server_time: { type: string, format: date-time }
                checkpoint_due: { type: boolean }
                session: { $ref: "#/components/schemas/Session" }
        CheckpointInput:
            type: object
            required: [file_id]
            properties:
                file_id:
                    {
                        type: string,
                        format: uuid,
                        description: "Finished private-bucket upload",
                    }
        CourierStats:
            type: object
            properties:
                lifetime: { type: object }
                weekly:
                    {
                        type: object,
                        description: "active_s vs WHO 150 min goal",
                    }
        DecisionInput:
            type: object
            properties:
                reason:
                    {
                        type: string,
                        description: "Required for reject; audit-logged",
                    }
                note: { type: string }
        SanctionInput:
            type: object
            required: [kind, reason_code]
            properties:
                kind: { type: string, enum: [freeze, unfreeze, ban] }
                reason_code: { type: string }
                note: { type: string }
                ends_at: { type: string, format: date-time }
        DeliveryStatus:
            {
                type: string,
                enum:
                    [
                        searching,
                        offered,
                        assigned,
                        at_pickup,
                        picked_up,
                        at_dropoff,
                        delivered,
                        staff_searching,
                        no_courier,
                        cancelled,
                    ],
            }
        Offer:
            type: object
            properties:
                id: { type: string, format: uuid }
                delivery_id: { type: string, format: uuid }
                kind: { type: string, enum: [directed, broadcast, staff] }
                status:
                    {
                        type: string,
                        enum: [pending, accepted, declined, expired],
                    }
                expires_at: { type: string, format: date-time }
                seconds_left:
                    { type: integer, description: "Seconds until expiry" }
                order:
                    type: object
                    properties:
                        merchant_name: { type: string }
                        to_pickup_m:
                            {
                                type: number,
                                description: "Meters courier to restaurant",
                            }
                        trip_m:
                            {
                                type: number,
                                description: "Meters restaurant to customer",
                            }
                        payout_minor:
                            {
                                type: integer,
                                description: "Courier payout, minor units",
                            }
                        currency: { type: string }
                        size_class: { type: string, enum: [S, M, L] }
                        spill_risk: { type: string, enum: [low, medium, high] }
                        ready_at_est: { type: string, format: date-time }
                        window_end: { type: string, format: date-time }
        OfferList:
            {
                type: object,
                properties:
                    {
                        offers:
                            {
                                type: array,
                                items: { $ref: "#/components/schemas/Offer" },
                            },
                    },
            }
        Delivery:
            type: object
            properties:
                id: { type: string, format: uuid }
                order_id: { type: string, format: uuid }
                type: { type: string, enum: [workout, staff] }
                status: { $ref: "#/components/schemas/DeliveryStatus" }
                order_status: { $ref: "#/components/schemas/OrderStatus" }
                currency: { type: string }
                pickup:
                    type: object
                    properties:
                        merchant_name: { type: string }
                        lat: { type: number }
                        lng: { type: number }
                        note: { type: string }
                        address: { type: string }
                dropoff: { $ref: "#/components/schemas/GeoPoint" }
                eta_s: { type: integer, description: "Seconds to next stop" }
                route_polyline:
                    {
                        type: string,
                        description: "Encoded polyline, empty when estimated",
                    }
                route_warning:
                    {
                        type: string,
                        description: "Required beta disclaimer for WALK/BICYCLE routes",
                    }
                size_class: { type: string, enum: [S, M, L] }
                spill_risk: { type: string, enum: [low, medium, high] }
                ready_at_est: { type: string, format: date-time }
                window_end: { type: string, format: date-time }
                nudged: { type: boolean }
                assigned_at: { type: string, format: date-time }
        DeliveryEnvelope:
            type: object
            properties:
                delivery: { $ref: "#/components/schemas/Delivery" }
                impact:
                    type: object
                    properties:
                        distance_m: { type: number }
                        active_s: { type: integer }
                payout: { $ref: "#/components/schemas/Money" }
        ArrivedInput:
            type: object
            required: [at]
            properties:
                at: { type: string, enum: [pickup, dropoff] }
        PickupInput:
            type: object
            required: [pickup_code]
            properties:
                pickup_code:
                    {
                        type: string,
                        description: "Code shown on the merchant screen",
                    }
        DeliveredInput:
            type: object
            properties:
