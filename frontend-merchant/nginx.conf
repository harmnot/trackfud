server {
  listen 80;
  root /usr/share/nginx/html;
  location /merchant/ {
    alias /usr/share/nginx/html/;
    try_files $uri $uri/ /merchant/index.html;
  }
  location /merchant/assets/ {
    alias /usr/share/nginx/html/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /merchant/sw.js { alias /usr/share/nginx/html/sw.js; add_header Cache-Control "no-cache"; }
  location = /merchant/manifest.webmanifest { alias /usr/share/nginx/html/manifest.webmanifest; add_header Cache-Control "no-cache"; }
}
