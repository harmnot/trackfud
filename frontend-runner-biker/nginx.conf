server {
  listen 80;
  root /usr/share/nginx/html;
  # Bare path (no trailing slash) → canonical subpath. Keeps query strings.
  location = /courier { return 301 /courier/$is_args$args; }
  location /courier/ {
    alias /usr/share/nginx/html/;
    try_files $uri $uri/ /courier/index.html;
  }
  location /courier/assets/ {
    alias /usr/share/nginx/html/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /courier/sw.js { alias /usr/share/nginx/html/sw.js; add_header Cache-Control "no-cache"; }
  location = /courier/manifest.webmanifest { alias /usr/share/nginx/html/manifest.webmanifest; add_header Cache-Control "no-cache"; }
}
