server {
  listen 80;
  root /usr/share/nginx/html;
  location /back-office/ {
    alias /usr/share/nginx/html/;
    try_files $uri $uri/ /back-office/index.html;
  }
  location /back-office/assets/ {
    alias /usr/share/nginx/html/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /back-office/sw.js { alias /usr/share/nginx/html/sw.js; add_header Cache-Control "no-cache"; }
  location = /back-office/manifest.webmanifest { alias /usr/share/nginx/html/manifest.webmanifest; add_header Cache-Control "no-cache"; }
}
