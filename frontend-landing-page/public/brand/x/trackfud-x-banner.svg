  <rect x="1120" y="120" width="150" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
  <text x="1128" y="149" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="24" fill="#d4d4d8">● live</text>
  <text x="500" y="218" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="120" letter-spacing="-4" fill="#f4f4f5">Trackfud</text>
  <text x="500" y="272" text-anchor="middle" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="40" fill="#a1a1aa">run. ride. earn</text>
  <text x="500" y="330" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="27" fill="#d4d4d8">Food carried by runners &amp; bikers — order, earn &amp; sell in your browser.</text>
