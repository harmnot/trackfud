<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500" role="img" aria-label="Trackfud X banner">
  <title>Trackfud — X banner</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;800&amp;family=Newsreader:ital,wght@1,500&amp;display=swap');
  </style>
  <rect width="1500" height="500" fill="#060709"/>
  <circle cx="180" cy="40" r="420" fill="#ffffff" opacity="0.05"/>
  <circle cx="1350" cy="480" r="460" fill="#ffffff" opacity="0.035"/>
  <line x1="0" y1="60" x2="1500" y2="60" stroke="#ffffff" stroke-opacity="0.06"/>
  <line x1="0" y1="440" x2="1500" y2="440" stroke="#ffffff" stroke-opacity="0.06"/>
  <!-- route motif, echoes landing hero -->
  <path d="M880 360 C 1020 300, 1080 220, 1180 220 S 1330 300, 1420 180" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="10 10"/>
  <circle cx="880" cy="360" r="20" fill="none" stroke="#34d399" stroke-opacity="0.5" stroke-width="2"/>
